[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "c-code-score"
version = "0.1.0"
description = "Triage heuristic for C functions: flags review/refactoring candidates (nesting x pointer depth x deref chains)."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = ["c", "static-analysis", "code-quality", "refactoring", "triage"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
c-score = "score:main"

[tool.setuptools]
py-modules = ["score"]
